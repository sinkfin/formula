name: Build

# =============================================================================
# xaga (MT6895 / 天玑8100 / Redmi Note 11T Pro) —— RootFS 根文件系统构建
#
# 本工作流只做 RootFS（内核编译已移除，见 .github/workflows/ 其他文件）
#
# 可构建的系统:
#   postmarketOS edge (phosh / none / plasma-mobile)
#   Arch Linux ARM
#   Debian 12 (bookworm)
#   Ubuntu 24.04 LTS (noble) / 25.10 (questing) / 26.04 LTS (resolute)
#
# 硬约束（来自 MT6895-Mainline/initramfs 的 init.c + 实机踩坑记录）:
#   * userdata 上的 rootfs 必须是 ext4
#     - 原厂内核命名 /dev/sdc86，主线内核命名 /dev/mmcblk0p86（同一个分区）
#   * initramfs 不读 cmdline，pivot 后直接 execve /sbin/init
#     - systemd 发行版: /sbin/init -> systemd；pmOS: /sbin/init = openrc
#   * WiFi NVRAM 在 nvdata (/dev/sdc13, 只读 ext4)，由 initramfs 提供
#     - rootfs 必须有 mediatek 固件，否则 WiFi/蓝牙/声卡/触控全废
#   * 构建过程不使用 loop 设备: bootstrap 到目录 -> mkfs.ext4 -d 直接出镜像
#     （只有 pmOS 例外：pmbootstrap 自身依赖 loop）
#
# 产物: xaga-rootfs-<id>-<release>/
#         ├── xaga-rootfs-<id>-<release>.tar.zst  (含 .img / -sparse.img)
#         └── SHA256SUMS-xaga-rootfs-<id>-<release>.txt
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      ROOTFS_TYPE:
        description: "RootFS 发行版 (all = 全部系统各构建一份)"
        required: true
        default: "Arch Linux ARM"
        type: choice
        options:
          - "all"
          - "Arch Linux ARM"
          - "Debian 12"
          - "Ubuntu 24.04 LTS"
          - "Ubuntu 25.10"
          - "Ubuntu 26.04 LTS"
          - "postmarketOS"
      PMOS_UI:
        description: "postmarketOS 桌面环境 (仅 pmOS 生效)"
        required: false
        default: "phosh"
        type: choice
        options:
          - "phosh"
          - "none"
          - "plasma-mobile"
      SIZE:
        description: "镜像大小 (6+128 机器默认 6G)"
        required: true
        default: "6G"
        type: string
      HOSTNAME:
        description: "主机名"
        required: true
        default: "xaga"
        type: string
      ROOT_PASSWORD:
        description: "root 密码"
        required: true
        default: "1234"
        type: string
      MAKE_SPARSE:
        description: "同时生成 sparse 镜像 (fastboot flash 用这个)"
        required: false
        default: true
        type: boolean
      INSTALL_FIRMWARE:
        description: "安装 mediatek 固件 (强烈建议开启，否则无线/触控失效)"
        required: false
        default: true
        type: boolean
      EXTRA_PACKAGES:
        description: "额外软件包，空格分隔 (例如 openssh-server vim)"
        required: false
        default: "openssh-server"
        type: string
      MIRROR:
        description: "软件源镜像 (留空用官方源，例如 https://mirrors.ustc.edu.cn/debian)"
        required: false
        default: ""
        type: string
      ENABLE_NOTIFY:
        description: "开启钉钉/Server酱构建通知"
        required: false
        default: true
        type: boolean

env:
  # 主线内核把 userdata 叫 mmcblk0p86，原厂内核叫 sdc86，是同一个分区
  ROOT_PART_MAINLINE: "/dev/mmcblk0p86"
  ROOT_PART_ANDROID: "/dev/sdc86"
  NVDATA_PART: "/dev/sdc13"        # WiFi NVRAM，只读 ext4
  BUILD_DIR: ${{ runner.temp }}/xaga-build
  WORKDIR: ${{ runner.temp }}/xaga-build/rootfs
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ---------------------------------------------------------------------------
  # 1) 计划: 把选项翻译成构建矩阵
  # ---------------------------------------------------------------------------
  plan:
    name: 构建计划
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      size: ${{ steps.gen.outputs.size }}
      hostname: ${{ steps.gen.outputs.hostname }}
      rootpw: ${{ steps.gen.outputs.rootpw }}
      make_sparse: ${{ steps.gen.outputs.make_sparse }}
      install_firmware: ${{ steps.gen.outputs.install_firmware }}
      extra_packages: ${{ steps.gen.outputs.extra_packages }}
      mirror: ${{ steps.gen.outputs.mirror }}
    env:
      IN_TYPE: ${{ inputs.ROOTFS_TYPE }}
      IN_UI: ${{ inputs.PMOS_UI }}
      IN_SIZE: ${{ inputs.SIZE }}
      IN_HOST: ${{ inputs.HOSTNAME }}
      IN_PW: ${{ inputs.ROOT_PASSWORD }}
      IN_SPARSE: ${{ inputs.MAKE_SPARSE }}
      IN_FW: ${{ inputs.INSTALL_FIRMWARE }}
      IN_PKGS: ${{ inputs.EXTRA_PACKAGES }}
      IN_MIRROR: ${{ inputs.MIRROR }}
    steps:
      - name: 生成矩阵
        id: gen
        run: |
          set -euo pipefail

          sel="${IN_TYPE:-Arch Linux ARM}"
          ui="${IN_UI:-phosh}"
          size="${IN_SIZE:-6G}"
          hostname="${IN_HOST:-xaga}"
          rootpw="${IN_PW:-1234}"
          if [ -n "$rootpw" ]; then echo "::add-mask::$rootpw"; fi
          mirror="${IN_MIRROR:-}"

          make_sparse=true
          if [ "${IN_SPARSE:-true}" != "true" ]; then make_sparse=false; fi
          install_firmware=true
          if [ "${IN_FW:-true}" != "true" ]; then install_firmware=false; fi

          # id / release(代号) / title / method / ver(版本号，仅 Ubuntu base 下载用)
          arch='{"id":"arch","release":"latest","title":"Arch Linux ARM","method":"tarball","ver":""}'
          deb='{"id":"debian","release":"bookworm","title":"Debian 12","method":"mmdebstrap","ver":"12"}'
          u2404='{"id":"ubuntu","release":"noble","title":"Ubuntu 24.04 LTS","method":"ubuntu-base","ver":"24.04"}'
          u2510='{"id":"ubuntu","release":"questing","title":"Ubuntu 25.10","method":"ubuntu-base","ver":"25.10"}'
          u2604='{"id":"ubuntu","release":"resolute","title":"Ubuntu 26.04 LTS","method":"ubuntu-base","ver":"26.04"}'
          pmos="{\"id\":\"pmos\",\"release\":\"edge\",\"title\":\"postmarketOS ($ui)\",\"method\":\"pmbootstrap\",\"ver\":\"\"}"

          case "$sel" in
            all)              inc="$arch,$deb,$u2404,$u2510,$u2604,$pmos" ;;
            "Arch Linux ARM") inc="$arch" ;;
            "Debian 12")      inc="$deb" ;;
            "Ubuntu 24.04 LTS") inc="$u2404" ;;
            "Ubuntu 25.10")   inc="$u2510" ;;
            "Ubuntu 26.04 LTS") inc="$u2604" ;;
            postmarketOS)     inc="$pmos" ;;
            *) echo "::error::未知的 ROOTFS_TYPE: $sel"; exit 1 ;;
          esac

          matrix="$(printf '{"include":[%s]}' "$inc" | jq -c .)"

          {
            echo "matrix=$matrix"
            echo "size=$size"
            echo "hostname=$hostname"
            echo "rootpw=$rootpw"
            echo "make_sparse=$make_sparse"
            echo "install_firmware=$install_firmware"
            echo "extra_packages=${IN_PKGS:-}"
            echo "mirror=$mirror"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 构建计划"
            echo ""
            echo "| 系统 | distro/release | 方式 |"
            echo "|---|---|---|"
            echo "$matrix" | jq -r '.include[] | "| " + .title + " | `" + .id + "/" + .release + "` | " + .method + " |"'
            echo ""
            echo "- 镜像大小: \`$size\` ｜ 主机名: \`$hostname\` ｜ sparse: \`$make_sparse\` ｜ 固件: \`$install_firmware\`"
            echo "- root 分区: \`${ROOT_PART_MAINLINE:-/dev/mmcblk0p86}\`（主线内核命名，原厂内核为 \`${ROOT_PART_ANDROID:-/dev/sdc86}\`）"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2) 构建 rootfs（矩阵）
  # ---------------------------------------------------------------------------
  rootfs:
    name: 构建 ${{ matrix.title }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      DISTRO: ${{ matrix.id }}
      RELEASE: ${{ matrix.release }}
      CODENAME: ${{ matrix.release }}
      VER: ${{ matrix.ver }}
      TITLE: ${{ matrix.title }}
      METHOD: ${{ matrix.method }}
      SIZE: ${{ needs.plan.outputs.size }}
      HOSTNAME: ${{ needs.plan.outputs.hostname }}
      ROOTPW: ${{ needs.plan.outputs.rootpw }}
      MAKE_SPARSE: ${{ needs.plan.outputs.make_sparse }}
      INSTALL_FIRMWARE: ${{ needs.plan.outputs.install_firmware }}
      EXTRA_PACKAGES: ${{ needs.plan.outputs.extra_packages }}
      MIRROR: ${{ needs.plan.outputs.mirror }}
    steps:
      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装宿主依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support e2fsprogs file \
            debootstrap mmdebstrap libarchive-tools \
            android-sdk-libsparse-utils zstd curl wget ca-certificates jq rsync
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo mkdir -p "$BUILD_DIR"
          sudo rm -rf "$WORKDIR"
          sudo mkdir -p "$WORKDIR"

      # ---------------- 各发行版 bootstrap ----------------
      - name: Bootstrap - Arch Linux ARM
        if: matrix.method == 'tarball'
        run: |
          set -euo pipefail
          URL="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
          sudo curl -fsSL -o "$BUILD_DIR/archlinuxarm.tar.gz" "$URL"
          sudo tar -xpzf "$BUILD_DIR/archlinuxarm.tar.gz" -C "$WORKDIR"
          sudo rm -f "$BUILD_DIR/archlinuxarm.tar.gz"

      - name: Bootstrap - Debian (mmdebstrap)
        if: matrix.method == 'mmdebstrap'
        run: |
          set -euo pipefail
          ARGS=(--architectures=arm64 --variant=minbase
                --components=main,contrib,non-free,non-free-firmware
                --include=systemd,systemd-sysv,dbus,ca-certificates)
          if [ -n "$MIRROR" ]; then ARGS+=(--mirror="$MIRROR"); fi
          if [ "$INSTALL_FIRMWARE" = "true" ]; then
            ARGS+=(--include=linux-firmware,firmware-mediatek)
          fi
          sudo mmdebstrap "${ARGS[@]}" "$CODENAME" "$WORKDIR"
          sudo du -sh "$WORKDIR"

      - name: Bootstrap - Ubuntu base
        if: matrix.method == 'ubuntu-base'
        run: |
          set -euo pipefail
          BASE_URL="https://cdimage.ubuntu.com/ubuntu-base/releases/${VER}"
          FILENAME="$(curl -fsSL "$BASE_URL/release/" \
            | grep -oE "ubuntu-base-${VER}[^\"]*base-arm64\.tar\.gz" | sort -V | tail -1 || true)"
          if [ -z "$FILENAME" ]; then
            echo "::error::找不到 Ubuntu ${VER} 的 arm64 base 包（$BASE_URL/release/）"
            exit 1
          fi
          echo "使用: $FILENAME"
          sudo curl -fsSL -o "$BUILD_DIR/ubuntu-base.tar.gz" "$BASE_URL/release/$FILENAME"
          sudo tar -xpzf "$BUILD_DIR/ubuntu-base.tar.gz" -C "$WORKDIR"
          sudo rm -f "$BUILD_DIR/ubuntu-base.tar.gz"
          # ubuntu-base 不带 apt 源，补上
          SRC="${MIRROR:-http://ports.ubuntu.com/ubuntu-ports}"
          sudo tee "$WORKDIR/etc/apt/sources.list" >/dev/null <<EOF
          deb $SRC $CODENAME main restricted universe multiverse
          deb $SRC $CODENAME-updates main restricted universe multiverse
          deb $SRC $CODENAME-security main restricted universe multiverse
          EOF

      - name: Bootstrap - postmarketOS (pmbootstrap)
        if: matrix.method == 'pmbootstrap'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support python3-pip
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --break-system-packages ./pmbootstrap
          UI="${{ inputs.PMOS_UI }}"
          printf '\ngeneric\ngeneric-aarch64\nmainline\n%s\nedge\n\n\n\n\n\n\n\n\n\n' "$UI" | pmbootstrap init
          pmbootstrap install --no-kernel --filesystem ext4
          PMOS_IMG=$(ls -t ~/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/generic-aarch64*.img 2>/dev/null | head -1)
          if [ -z "$PMOS_IMG" ]; then echo "::error::未找到 pmOS 镜像"; exit 1; fi
          sudo losetup -P -f "$PMOS_IMG"
          LOOP_DEV=$(sudo losetup -j "$PMOS_IMG" | cut -d: -f1)
          sudo mkdir -p "$BUILD_DIR/pmos-mnt"
          MOUNTED=""
          for p in "${LOOP_DEV}p2" "${LOOP_DEV}p1" "$LOOP_DEV"; do
            if [ -e "$p" ] && sudo mount -o ro "$p" "$BUILD_DIR/pmos-mnt"; then MOUNTED="$p"; break; fi
          done
          if [ -z "$MOUNTED" ]; then sudo losetup -d "$LOOP_DEV"; echo "::error::pmOS 镜像分区挂载失败"; exit 1; fi
          echo "已挂载 $MOUNTED"
          # 统一成目录，后面的配置和打包流程对所有发行版一致
          sudo rsync -aHAX "$BUILD_DIR/pmos-mnt/" "$WORKDIR/"
          sudo umount "$BUILD_DIR/pmos-mnt"
          sudo losetup -d "$LOOP_DEV"

      # ---------------- 通用配置 ----------------
      - name: 写入基础配置
        run: |
          set -euo pipefail
          echo "$HOSTNAME" | sudo tee "$WORKDIR/etc/hostname" >/dev/null
          sudo tee "$WORKDIR/etc/hosts" >/dev/null <<EOF
          127.0.0.1  localhost
          127.0.1.1  $HOSTNAME
          ::1        localhost ip6-localhost ip6-loopback
          ff02::1    ip6-allnodes
          ff02::2    ip6-allrouters
          EOF
          sudo cp -f /etc/resolv.conf "$WORKDIR/etc/resolv.conf"
          # chroot 里跑 aarch64 程序需要解释器
          sudo cp -f "$(command -v qemu-aarch64-static)" "$WORKDIR/usr/bin/qemu-aarch64-static"

      - name: chroot 内配置（固件 / 额外包 / root 密码 / init）
        run: |
          set -euo pipefail
          sudo mkdir -p "$WORKDIR/proc" "$WORKDIR/sys" "$WORKDIR/dev"
          sudo mount -t proc proc "$WORKDIR/proc"
          sudo mount -t sysfs sysfs "$WORKDIR/sys"
          sudo mount --bind /dev "$WORKDIR/dev"
          sudo mount --bind /dev/pts "$WORKDIR/dev/pts" 2>/dev/null || true

          run() { sudo chroot "$WORKDIR" /bin/sh -c "$1"; }

          case "$DISTRO" in
            arch)
              UPDATE='pacman-key --init; pacman-key --populate archlinuxarm; pacman -Sy'
              INSTALL='pacman -S --noconfirm --needed'
              FW='linux-firmware linux-firmware-whence'
              SYSINIT='systemd systemd-sysvcompat'
              ;;
            debian)
              UPDATE='apt-get update'
              INSTALL='apt-get install -y --no-install-recommends'
              FW='linux-firmware firmware-mediatek'
              SYSINIT='systemd systemd-sysv'
              ;;
            ubuntu)
              UPDATE='apt-get update'
              INSTALL='apt-get install -y --no-install-recommends'
              FW='linux-firmware'
              SYSINIT='systemd systemd-sysv'
              ;;
            pmos)
              UPDATE='apk update'
              INSTALL='apk add --no-cache'
              FW='linux-firmware-mediatek linux-firmware-other'
              SYSINIT=''
              ;;
          esac

          PKGS=""
          if [ "$INSTALL_FIRMWARE" = "true" ]; then PKGS="$FW"; fi
          if [ ! -e "$WORKDIR/sbin/init" ] && [ -n "$SYSINIT" ]; then PKGS="$PKGS $SYSINIT"; fi
          if [ -n "$EXTRA_PACKAGES" ]; then PKGS="$PKGS $EXTRA_PACKAGES"; fi

          if [ -n "$PKGS" ]; then
            run "$UPDATE" || echo "::warning::更新软件源失败，继续尝试安装"
            if ! run "$INSTALL $PKGS"; then
              echo "::warning::以下包安装失败: $PKGS —— 开机后请手动补装（尤其是固件）"
            fi
          fi

          # root 密码
          if ! run "echo 'root:${ROOTPW}' | chpasswd"; then
            run "printf '%s\n%s\n' '${ROOTPW}' '${ROOTPW}' | passwd root" \
              || echo "::warning::设置 root 密码失败"
          fi

          # 主机名（部分发行版 bootstrap 之后会覆盖）
          run "echo '${HOSTNAME}' > /etc/hostname"

          # systemd 发行版开个网络/ssh，方便首次开机就能连
          if [ "$DISTRO" != "pmos" ]; then
            run "systemctl enable systemd-networkd 2>/dev/null; systemctl enable systemd-resolved 2>/dev/null; true"
            run "systemctl enable ssh 2>/dev/null || systemctl enable sshd 2>/dev/null || true"
          else
            run "rc-update add sshd default 2>/dev/null || true"
          fi

          # 别把 qemu 解释器打进镜像
          sudo rm -f "$WORKDIR/usr/bin/qemu-aarch64-static"

      - name: 卸载 chroot 挂载
        if: always()
        run: |
          sudo rm -f "$WORKDIR/usr/bin/qemu-aarch64-static" 2>/dev/null || true
          sudo umount -lf "$WORKDIR/dev/pts" 2>/dev/null || true
          sudo umount -lf "$WORKDIR/dev" 2>/dev/null || true
          sudo umount -lf "$WORKDIR/sys" 2>/dev/null || true
          sudo umount -lf "$WORKDIR/proc" 2>/dev/null || true

      # ---------------- 打包 ----------------
      - name: 打包 ext4 镜像（mkfs.ext4 -d，不用 loop）
        run: |
          set -euo pipefail
          IMG="$BUILD_DIR/xaga-rootfs-${DISTRO}-${RELEASE}.img"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

          used=$(sudo du -sm "$WORKDIR" | cut -f1)
          cap_mb=$(( $(numfmt --from=iec "$SIZE") / 1048576 ))
          echo "rootfs 内容 ${used}MB / 镜像容量 ${cap_mb}MB"
          if [ "$used" -ge "$cap_mb" ]; then
            echo "::error::内容 ${used}MB 装不进 $SIZE 的镜像，请调大 SIZE"
            exit 1
          fi
          if [ "$used" -gt $(( cap_mb * 85 / 100 )) ]; then
            echo "::warning::内容已占镜像 $(( used * 100 / cap_mb ))%，建议调大 SIZE"
          fi

          truncate -s "$SIZE" "$IMG"
          sudo mkfs.ext4 -F -d "$WORKDIR" -L "${HOSTNAME}-rootfs" -b 4096 "$IMG"
          sudo e2fsck -fn "$IMG" || { echo "::error::e2fsck 报告文件系统错误"; exit 1; }
          sudo dumpe2fs -h "$IMG" | grep -E 'Filesystem volume name|Filesystem magic number|Filesystem features' || true
          df -h /

      - name: 生成 sparse 镜像
        if: needs.plan.outputs.make_sparse == 'true'
        run: |
          set -euo pipefail
          SPARSE="${IMG%.img}-sparse.img"
          img2simg "$IMG" "$SPARSE"
          simg2img "$SPARSE" "$BUILD_DIR/roundtrip.img"
          rt=$(stat -c%s "$BUILD_DIR/roundtrip.img")
          or=$(stat -c%s "$IMG")
          rm -f "$BUILD_DIR/roundtrip.img"
          if [ "$rt" != "$or" ]; then
            echo "::error::sparse 往返后大小不一致: $rt != $or"
            exit 1
          fi
          ls -lh "$IMG" "$SPARSE"

      # ---------------- 校验 ----------------
      - name: 校验
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          echo "::group::文件系统必须是 ext4"
          magic=$(sudo dumpe2fs -h "$IMG" | awk -F': ' '/Filesystem magic number/{print $2}')
          echo "magic=$magic"
          [ "$magic" = "0xEF53" ] || fail "不是 ext4（BOOT_PARTITION 只认 ext4）"
          act=$(stat -c%s "$IMG"); exp=$(numfmt --from=iec "$SIZE")
          [ "$act" -le "$exp" ] || fail "镜像 $act 超过 -s $SIZE"
          echo "大小 $act / 上限 $exp: OK"
          echo "::endgroup::"

          echo "::group::/sbin/init（initramfs pivot 后直接 execve 它）"
          target=$(sudo readlink -f "$WORKDIR/sbin/init" 2>/dev/null || true)
          echo "/sbin/init => ${target:-<不存在>}"
          [ -n "$target" ] || fail "镜像里没有 /sbin/init，开机必黑屏"
          [ -x "$target" ] || fail "$target 不可执行"
          if [ "$DISTRO" = "pmos" ]; then
            echo "pmOS 使用 openrc: OK"
          else
            case "$target" in
              *systemd*) echo "指向 systemd: OK" ;;
              *) fail "/sbin/init 未指向 systemd（$target）" ;;
            esac
          fi
          echo "::endgroup::"

          echo "::group::主机名 / root 密码"
          hh=$(sudo cat "$WORKDIR/etc/hostname" 2>/dev/null || true)
          [ "$hh" = "$HOSTNAME" ] || fail "主机名是 '$hh'，期望 '$HOSTNAME'"
          if sudo grep -qE '^root:\$.+' "$WORKDIR/etc/shadow"; then
            echo "root 密码已写入: OK"
          else
            fail "/etc/shadow 里没有 root 密码"
          fi
          echo "::endgroup::"

          echo "::group::aarch64 用户态冒烟（qemu-user）"
          if [ "$DISTRO" = "pmos" ]; then
            sudo qemu-aarch64-static -L "$WORKDIR" "$WORKDIR/sbin/init" --version \
              || echo "::warning::openrc 未输出版本（不影响使用）"
          else
            SD=$(sudo readlink -f "$WORKDIR/lib/systemd/systemd" 2>/dev/null \
                 || sudo readlink -f "$WORKDIR/usr/lib/systemd/systemd" 2>/dev/null || true)
            [ -n "$SD" ] || fail "找不到 systemd 可执行文件"
            sudo qemu-aarch64-static -L "$WORKDIR" "$SD" --version \
              || fail "qemu 无法执行 $SD（架构或动态库有问题）"
          fi
          echo "::endgroup::"

          echo "::group::固件（WiFi/蓝牙/声卡/触控依赖 mediatek 固件）"
          if [ -d "$WORKDIR/lib/firmware/mediatek" ] || [ -d "$WORKDIR/usr/lib/firmware/mediatek" ]; then
            echo "mediatek 固件: 已安装"
          else
            echo "::warning::没有 /lib/firmware/mediatek —— WiFi、蓝牙、声卡、触控会失效，开机后请手动补装"
          fi
          echo "::endgroup::"

      - name: 压缩并生成校验值
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_DIR" 2>/dev/null || true
          cd "$BUILD_DIR"
          base="xaga-rootfs-${DISTRO}-${RELEASE}"
          files=("$base.img")
          if [ -f "$base-sparse.img" ]; then files+=("$base-sparse.img"); fi
          sha256sum "${files[@]}" > "SHA256SUMS-$base.txt"
          # -S 保留稀疏属性，下载后 tar -xS 仍是稀疏文件
          tar -cSf - "${files[@]}" | zstd -T0 -12 -o "$base.tar.zst"
          sha256sum "$base.tar.zst" >> "SHA256SUMS-$base.txt"
          ls -lh "$base.tar.zst"
          {
            echo "### $TITLE —— $base"
            echo '```'
            cat "SHA256SUMS-$base.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 RootFS 产物
        uses: actions/upload-artifact@v4
        with:
          name: xaga-rootfs-${{ matrix.id }}-${{ matrix.release }}
          path: |
            ${{ env.BUILD_DIR }}/xaga-rootfs-*.tar.zst
            ${{ env.BUILD_DIR }}/SHA256SUMS-*.txt
          retention-days: 7
          if-no-files-found: error

      - name: 清理
        if: always()
        run: |
          sudo rm -rf "$WORKDIR" 2>/dev/null || true
          df -h /

  # ---------------------------------------------------------------------------
  # 3) 通知
  # ---------------------------------------------------------------------------
  notify:
    name: 发送构建通知
    runs-on: ubuntu-latest
    needs: [plan, rootfs]
    if: ${{ always() && inputs.ENABLE_NOTIFY }}
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v5

      - name: 判定整体构建状态
        id: status
        run: |
          R="${{ needs.rootfs.result }}"
          if [ "$R" = "failure" ] || [ "$R" = "cancelled" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: 调用 bot.py 发送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          pip3 install --quiet requests 2>/dev/null || true
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 注意: bot.py 在 .github/ 下，不是仓库根目录
          python3 .github/bot.py --notify \
            --status ${{ steps.status.outputs.result }} \
            --artifact-url "$RUN_URL"

      - name: 刷机提示
        run: |
          {
            echo "## 刷机提示"
            echo ""
            echo '```bash'
            echo '# 1) 确认当前槽位，刷到对应的 boot_a / boot_b'
            echo 'fastboot getvar current-slot'
            echo 'fastboot flash boot_a boot-physical.img   # 或 boot_b'
            echo ''
            echo '# 2) 刷 rootfs（会清空内置存储，务必先备份）'
            echo 'fastboot flash userdata xaga-rootfs-<id>-<release>-sparse.img'
            echo ''
            echo '# 备选: 进 initramfs 的 adb，手动格式化再解包（不依赖 sparse）'
            echo '#   mkfs.ext4 -F /dev/mmcblk0p86 && mount /dev/mmcblk0p86 /mnt'
            echo '#   tar -xpf rootfs.tar -C /mnt'
            echo ''
            echo '# 3) 开机后扩到整个 userdata 分区'
            echo 'resize2fs /dev/mmcblk0p86'
            echo '```'
            echo ""
            echo "> MTK 的 v4 boot header 不支持 \`fastboot boot\`，别用它临时启动验证；"
            echo "> 直接 flash 对应槽位后重启。设备是 6+128 时记得 cmdline 带 \`mem=6G\`。"
          } >> "$GITHUB_STEP_SUMMARY"
