name: Build Arch Linux RootFS (xaga mainline)

# =============================================================================
# 为 Redmi Note 11T Pro (xaga / MT6895 / 天玑8100) 主线 7.2 内核构建
# Arch Linux ARM 根文件系统，并把内核模块注进去。
#
# 构建任务（TASK 输入）：
#   全部     —— 编内核+模块+boot.img，再做 rootfs（默认）
#   仅内核   —— 只出 boot.img / Image.gz / initramfs / modules
#   仅RootFS —— 只做 rootfs，模块从「历史运行的 xaga-modules」下载
#               （必须填 MODULES_RUN_ID，或勾选 SKIP_MODULES）
#
# ⚠️ 为什么三个 job 都不用 job-level if：
#    GitHub Actions 里 needs 的 job 一旦被 skip，下游 job 会无条件跟着 skip，
#    连 if: always() 也救不回来。所以本文件统一用 **step-level if** 控制，
#    保证 needs 链不断、notify 总能发出来。
#
# 与旧工作流的差异（都是本轮实测踩出来的，别改回去）：
#   1. defconfig 用 merge_config.sh 合并 defconfig + xaga.config。
#      xaga.config 是 fragment，不是完整 defconfig，直接当 defconfig 用会缺一大片配置。
#   2. **必须关掉 MT8183/8188/8192/8195/8365 + SOF MT8186/8195**，否则
#      mt8183-afe-pcm.c 与 common/mtk-base-afe.h 的 MTK_AFE_RATE_* 枚举重定义直接编挂。
#   3. 关掉 CONFIG_WERROR，避免新版 clang 的新警告升级成错误。
#   4. 首次构建关 Rust（要 rustc 1.85+ / bindgen 0.71+）。
#   5. rootfs 走 "解包到目录 + mkfs.ext4 -d"，**不依赖 loop 设备**。
#   6. 内核模块由 kernel job 以 artifact 传入，注入后在 aarch64 chroot 里 depmod。
#   7. 6+128 机型 cmdline 带 mem=6G（DT 的 memory 节点写死 8 GiB）。
#   8. 内核版本从 modules tar 的目录名反推，不依赖 kernel job 的 output，
#      这样「仅RootFS」模式拉历史 artifact 也能正确 depmod。
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      TASK:
        description: "构建任务"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "仅内核"
          - "仅RootFS"
      RUNNER:
        description: "rootfs 运行器（ARM64 原生 runner 可完全绕开 qemu；公开仓库免费）"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
      MODULES_RUN_ID:
        description: "【仅RootFS】从哪个历史 run 下载 xaga-modules（留空=本次运行）"
        required: false
        default: ""
        type: string
      SKIP_MODULES:
        description: "跳过内核模块注入（rootfs 会没有 /lib/modules，仅调试用）"
        required: false
        default: false
        type: boolean
      ROOTFS_SIZE:
        description: "rootfs 镜像大小"
        required: true
        default: "4G"
        type: string
      ROOT_PART:
        description: "物理 root 分区（主线内核是 mmcblk 命名，不是 sdc）"
        required: true
        default: "/dev/mmcblk0p86"
        type: string
      MEM_LIMIT:
        description: "cmdline mem= 限制（6+128 填 6G；留空=不限制）"
        required: false
        default: "6G"
        type: string
      ROOT_PASSWORD:
        description: "root 密码"
        required: true
        default: "1234"
        type: string
      EXTRA_PACKAGES:
        description: "Arch 软件包（空格分隔，不含固件包）"
        required: false
        default: "networkmanager iwd openssh sudo vim less curl wget ca-certificates"
        type: string
      FIRMWARE_PACKAGE:
        description: "联发科固件包（rootfs 缺了 WiFi/蓝牙/触控会废）"
        required: false
        default: "linux-firmware-mediatek"
        type: string
      KERNEL_IMAGE:
        description: "打包进 boot.img 的内核镜像（gzip 更小且与原厂一致）"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - "Image.gz"
          - "Image"
      APPEND_DTB:
        description: "把 dtb 拼到内核尾部（主线 arm64 不识别，默认关闭）"
        required: false
        default: false
        type: boolean
      BOOT_HEADER_VERSION:
        description: "boot header 版本（原厂 xaga 是 4）"
        required: true
        default: "4"
        type: string
      BOOT_PAGESIZE:
        description: "boot.img pagesize（原厂 xaga 是 4096）"
        required: true
        default: "4096"
        type: string
      BOOT_BASE:
        description: "boot header base（留空=不传；MTK 建议由 unpackbootimg 解出原厂值填上）"
        required: false
        default: ""
        type: string
      BOOT_KERNEL_OFFSET:
        description: "kernel_offset（留空=不传）"
        required: false
        default: ""
        type: string
      BOOT_RAMDISK_OFFSET:
        description: "ramdisk_offset（留空=不传）"
        required: false
        default: ""
        type: string
      BOOT_TAGS_OFFSET:
        description: "tags_offset（留空=不传）"
        required: false
        default: ""
        type: string
      CLANG_VERSION:
        description: "LLVM Clang 版本"
        required: true
        default: "18"
        type: string
      KERNEL_COMMIT:
        description: "内核 commit（留空用分支头）"
        required: false
        default: "4fadce8d6bbce016a8965ad93a5285c565401c1d"
        type: string
      INITRAMFS_COMMIT:
        description: "initramfs commit（留空用分支头）"
        required: false
        default: "126b0c137338c1ec6a2cbc434bd67239ce2e38c7"
        type: string
      UPLOAD_RAW_IMG:
        description: "同时上传未压缩的 rootfs.img（体积大）"
        required: false
        default: false
        type: boolean
      ENABLE_NOTIFY:
        description: "开启钉钉/Server酱构建通知"
        required: false
        default: true
        type: boolean

env:
  KERNEL_REPO: "MT6895-Mainline/linux"
  KERNEL_BRANCH: "7.2-mt6895-xiaomi-xaga"
  INITRAMFS_REPO: "MT6895-Mainline/initramfs"
  CCACHE_MAXSIZE: "2G"

permissions:
  contents: read

concurrency:
  group: xaga-arch-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # Job 1：编译主线内核，产出内核模块 + boot.img
  # （TASK=仅RootFS 时所有步骤被 step-level if 跳过，job 仍然 success，
  #   这样下游 needs 不会被 skip 链带崩）
  # ==========================================================
  kernel:
    name: 编译主线内核 & 模块
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      kver: ${{ steps.kver.outputs.kver }}
    steps:
      - name: 任务模式
        run: |
          echo "TASK = ${{ inputs.TASK }}"
          if [ "${{ inputs.TASK }}" = "仅RootFS" ]; then
            echo "跳过内核编译，rootfs 将使用历史 run 的 xaga-modules"
          fi

      - name: Checkout 本仓库
        if: ${{ inputs.TASK != '仅RootFS' }}
        uses: actions/checkout@v5

      - name: 安装依赖 & LLVM 工具链
        if: ${{ inputs.TASK != '仅RootFS' }}
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            build-essential bison flex libelf-dev libssl-dev cpio lz4 wget git ccache \
            device-tree-compiler f2fs-tools util-linux
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ inputs.CLANG_VERSION }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-${{ inputs.CLANG_VERSION }} llvm-${{ inputs.CLANG_VERSION }} lld-${{ inputs.CLANG_VERSION }}
          CLANG_VER=${{ inputs.CLANG_VERSION }}
          sudo ln -sf /usr/bin/clang-${CLANG_VER} /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-${CLANG_VER} /usr/bin/clang++
          sudo ln -sf /usr/bin/lld-${CLANG_VER} /usr/bin/lld
          sudo ln -sf /usr/bin/ld.lld-${CLANG_VER} /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-${CLANG_VER} /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-${CLANG_VER} /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-${CLANG_VER} /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-readelf-${CLANG_VER} /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-${CLANG_VER} /usr/bin/llvm-strip
          # EFI libstub 的 STUBCPY 会调用 llvm-objdump，缺了会刷几十行 not found
          sudo ln -sf /usr/bin/llvm-objdump-${CLANG_VER} /usr/bin/llvm-objdump
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          ccache -M ${CCACHE_MAXSIZE}
          ccache -z

      - name: 安装 osm0sis mkbootimg
        if: ${{ inputs.TASK != '仅RootFS' }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          sed -i 's/-Werror//g' Makefile libmincrypt/Makefile
          make
          sudo cp mkbootimg /usr/local/bin/
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg 2>&1 | head -3

      - name: 拉取内核源码
        if: ${{ inputs.TASK != '仅RootFS' }}
        run: |
          git clone -b ${{ env.KERNEL_BRANCH }} https://github.com/${{ env.KERNEL_REPO }}.git kernel
          cd kernel
          if [ -n "${{ inputs.KERNEL_COMMIT }}" ]; then
            git fetch origin
            git checkout ${{ inputs.KERNEL_COMMIT }}
          fi

      - name: 生成 .config（defconfig + xaga fragment + 关冲突项）
        if: ${{ inputs.TASK != '仅RootFS' }}
        working-directory: kernel
        run: |
          export ARCH=arm64
          scripts/kconfig/merge_config.sh \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/xaga.config

          # MT8183 等无关联发科 ASoC 与 common/mtk-base-afe.h 枚举重定义，必挂
          scripts/config \
            --disable CONFIG_SND_SOC_MT8183 \
            --disable CONFIG_SND_SOC_MT8183_MT6358_TS3A227E_MAX98357A \
            --disable CONFIG_SND_SOC_MT8183_DA7219_MAX98357A \
            --disable CONFIG_SND_SOC_MT8188 \
            --disable CONFIG_SND_SOC_MT8188_MT6359 \
            --disable CONFIG_SND_SOC_MT8192 \
            --disable CONFIG_SND_SOC_MT8192_MT6359_RT1015_RT5682 \
            --disable CONFIG_SND_SOC_MT8195 \
            --disable CONFIG_SND_SOC_MT8195_MT6359 \
            --disable CONFIG_SND_SOC_MT8365 \
            --disable CONFIG_SND_SOC_MT8365_MT6357 \
            --disable CONFIG_SND_SOC_SOF_MT8186 \
            --disable CONFIG_SND_SOC_SOF_MT8195

          # 首次构建先关 Rust（需要 rustc 1.85+ / bindgen 0.71+）
          scripts/config --disable CONFIG_RUST
          scripts/config --disable CONFIG_DRM_PANIC_SCREEN_QR_CODE
          scripts/config --set-str CONFIG_DRM_PANIC_SCREEN "kmsg"

          # 关掉 WERROR，避免驱动警告升级成错误
          scripts/config --disable CONFIG_WERROR

          # rootfs 侧要用（镜像处理 / f2fs）
          scripts/config --set-val CONFIG_BLK_DEV_LOOP y
          scripts/config --set-val CONFIG_F2FS_FS y
          scripts/config --set-val CONFIG_F2FS_FS_SECURITY y

          make LLVM=1 ARCH=arm64 olddefconfig
          grep -E '^#? ?CONFIG_RUST$|CONFIG_DRM_PANIC_SCREEN|CONFIG_SND_SOC_MT(6895|8183)' .config || true

      - name: 全 LLVM 编译内核 + 模块
        if: ${{ inputs.TASK != '仅RootFS' }}
        working-directory: kernel
        run: |
          make -j$(nproc) ARCH=arm64 \
            CC=clang-${{ inputs.CLANG_VERSION }} \
            LD=ld.lld-${{ inputs.CLANG_VERSION }} \
            LLVM=1 LLVM_IAS=1 \
            Image.gz modules

      - name: 校验 DTB 是否链进 vmlinux
        if: ${{ inputs.TASK != '仅RootFS' }}
        working-directory: kernel
        run: |
          nm vmlinux | grep mt6895_xiaomi_xaga_dtb_start \
            || { echo "::error::DTB 没链进 vmlinux，刷上去必挂"; exit 1; }
          ls -lh arch/arm64/boot/Image.gz arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb

      - name: 输出内核版本
        if: ${{ inputs.TASK != '仅RootFS' }}
        id: kver
        working-directory: kernel
        run: echo "kver=$(make -s ARCH=arm64 kernelrelease)" >> $GITHUB_OUTPUT

      - name: 安装并打包内核模块
        if: ${{ inputs.TASK != '仅RootFS' }}
        working-directory: kernel
        run: |
          mkdir -p ${{ github.workspace }}/mods
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang-${{ inputs.CLANG_VERSION }} \
            modules_install \
            INSTALL_MOD_PATH=${{ github.workspace }}/mods \
            INSTALL_MOD_STRIP=1 \
            DEPMOD=true
          cd ${{ github.workspace }}/mods
          tar -czf ${{ github.workspace }}/xaga-modules.tar.gz lib
          ls -lh ${{ github.workspace }}/xaga-modules.tar.gz

      - name: 上传内核模块
        if: ${{ inputs.TASK != '仅RootFS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xaga-modules
          path: xaga-modules.tar.gz
          if-no-files-found: error

      - name: 构建 initramfs（物理分区版）
        if: ${{ inputs.TASK != '仅RootFS' }}
        run: |
          git clone https://github.com/${{ env.INITRAMFS_REPO }}.git initramfs
          cd initramfs
          if [ -n "${{ inputs.INITRAMFS_COMMIT }}" ]; then
            git fetch origin
            git checkout ${{ inputs.INITRAMFS_COMMIT }}
          fi
          sudo apt install -y --no-install-recommends gcc-aarch64-linux-gnu lz4
          make clean
          make CROSS=aarch64-linux-gnu- BOOT_PARTITION=${{ inputs.ROOT_PART }}
          cp initramfs.cpio.lz4 ../initramfs-physical.cpio.lz4

      - name: 打包 boot.img
        if: ${{ inputs.TASK != '仅RootFS' }}
        run: |
          cd kernel
          KIMG="arch/arm64/boot/${{ inputs.KERNEL_IMAGE }}"
          test -f "$KIMG" || { echo "::error::$KIMG 不存在，上一步编译产物缺失"; exit 1; }

          # 主线 arm64 的 head.S 不扫描 appended DTB（只认 bootloader 从 x0 传进来的 FDT，
          # 见 preserve_boot_args -> __fdt_pointer），而本树已经用 objcopy 把 DTB 链进
          # vmlinux（上一步 nm 已验证），setup.c 会用内置 DTB 覆盖 LK 的 Android FDT。
          # 所以默认不拼接；APPEND_DTB=true 才拼。
          if [ "${{ inputs.APPEND_DTB }}" = "true" ]; then
            cat "$KIMG" arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb > Image_with_dtb
            # 正确校验 appended DTB magic：hexdump -C 输出的字节之间带空格
            # （"d0 0d fe ed"），直接 grep d00dfeed 永远匹配不到 —— 这就是上一次跑挂的原因。
            tail -c +$(( $(stat -c %s "$KIMG") + 1 )) Image_with_dtb \
              | head -c 4 | od -An -tx1 | tr -d ' \n' \
              | grep -qx d00dfeed \
              || { echo "::error::appended DTB magic(d00dfeed) 未找到"; exit 1; }
            echo "appended DTB magic OK"
            KIMG="Image_with_dtb"
          fi

          MEM_ARG=""
          if [ -n "${{ inputs.MEM_LIMIT }}" ]; then
            MEM_ARG="mem=${{ inputs.MEM_LIMIT }}"
          fi

          # MTK v4 header 建议补齐 base / *_offset（取自原厂 boot.img），否则 LK 可能拒加载。
          # 取值方法：unpackbootimg -i stock_boot.img，看 BOARD_KERNEL_BASE 那几行。
          # 注意：这里必须用 if，不能写 [ -n "$X" ] && VAR=... —— bash -e 下条件为假会让整个 step 挂掉。
          HDR_ARGS=""
          if [ -n "${{ inputs.BOOT_BASE }}" ]; then
            HDR_ARGS="${HDR_ARGS} --base ${{ inputs.BOOT_BASE }}"
          fi
          if [ -n "${{ inputs.BOOT_KERNEL_OFFSET }}" ]; then
            HDR_ARGS="${HDR_ARGS} --kernel_offset ${{ inputs.BOOT_KERNEL_OFFSET }}"
          fi
          if [ -n "${{ inputs.BOOT_RAMDISK_OFFSET }}" ]; then
            HDR_ARGS="${HDR_ARGS} --ramdisk_offset ${{ inputs.BOOT_RAMDISK_OFFSET }}"
          fi
          if [ -n "${{ inputs.BOOT_TAGS_OFFSET }}" ]; then
            HDR_ARGS="${HDR_ARGS} --tags_offset ${{ inputs.BOOT_TAGS_OFFSET }}"
          fi

          mkbootimg \
            --header_version ${{ inputs.BOOT_HEADER_VERSION }} \
            --pagesize ${{ inputs.BOOT_PAGESIZE }} \
            ${HDR_ARGS} \
            --kernel "$KIMG" \
            --ramdisk ../initramfs-physical.cpio.lz4 \
            --cmdline "earlycon=0x11200000,115200 root=${{ inputs.ROOT_PART }} rootfstype=ext4 loglevel=7 ${MEM_ARG}" \
            -o ../boot-arch.img
          ls -lh ../boot-arch.img

      - name: 上传 boot 产物
        if: ${{ inputs.TASK != '仅RootFS' }}
        uses: actions/upload-artifact@v4
        with:
          name: xaga-boot
          # kernel/Image_with_dtb 只在 APPEND_DTB=true 时才会生成
          path: |
            boot-arch.img
            initramfs-physical.cpio.lz4
            kernel/Image_with_dtb
          if-no-files-found: warn

  # ==========================================================
  # Job 2：构建 Arch Linux ARM rootfs（注入内核模块）
  # ==========================================================
  arch-rootfs:
    name: 构建 Arch Linux ARM rootfs
    runs-on: ${{ inputs.RUNNER }}
    timeout-minutes: 60
    needs: kernel
    steps:
      - name: 任务模式 & 参数校验
        run: |
          echo "TASK = ${{ inputs.TASK }}"
          if [ "${{ inputs.TASK }}" = "仅内核" ]; then
            echo "跳过 rootfs 构建"
            exit 0
          fi
          # 提前把无效组合挡掉，免得跑 20 分钟才发现拉不到模块
          if [ "${{ inputs.TASK }}" = "仅RootFS" ] \
             && [ -z "${{ inputs.MODULES_RUN_ID }}" ] \
             && [ "${{ inputs.SKIP_MODULES }}" != "true" ]; then
            echo "::error::仅RootFS 模式下必须填 MODULES_RUN_ID（历史运行 ID），或勾选 SKIP_MODULES"
            exit 1
          fi
          if [ -n "${{ inputs.MODULES_RUN_ID }}" ]; then
            echo "模块来源：run ${{ inputs.MODULES_RUN_ID }} 的 xaga-modules"
          elif [ "${{ inputs.SKIP_MODULES }}" = "true" ]; then
            echo "模块来源：跳过（SKIP_MODULES=true）"
          else
            echo "模块来源：本次运行的 xaga-modules"
          fi

      - name: 安装依赖
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            wget curl git e2fsprogs util-linux libarchive-tools \
            qemu-user-static binfmt-support android-sdk-libsparse-utils

      - name: 注册 aarch64 binfmt（chroot 里跑 pacman 需要）
        if: ${{ inputs.TASK != '仅内核' && inputs.RUNNER != 'ubuntu-24.04-arm' }}
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc || true
            sudo update-binfmts --enable qemu-aarch64 || true
          fi
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "::warning::binfmt 仍不可用，尝试 docker multiarch 兜底"
            docker run --privileged --rm multiarch/qemu-user-static --reset -p yes || true
          fi
          ls /proc/sys/fs/binfmt_misc/ || true
          echo "== 当前 qemu-aarch64 的 binfmt flags =="
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || true

      - name: 下载并解压 Arch Linux ARM aarch64
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          wget -q --show-progress -O ArchLinuxARM-aarch64.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          mkdir -p rootfs
          # bsdtar 保住 xattr / capabilities；普通 tar 会丢，ping、sudo 这类会失效
          sudo bsdtar -xpf ArchLinuxARM-aarch64.tar.gz -C rootfs
          rm -f ArchLinuxARM-aarch64.tar.gz

      - name: 体检 rootfs 布局（aarch64 动态加载器）
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          echo "== /lib 布局 =="
          ls -ld rootfs/lib rootfs/usr/lib 2>&1 || true
          echo "== aarch64 loader =="
          ls -l rootfs/usr/lib/ld-linux-aarch64.so.1 2>&1 || true
          ls -l rootfs/lib/ld-linux-aarch64.so.1     2>&1 || true
          echo "== /bin/bash =="
          ls -lL rootfs/bin/bash 2>&1 || true

          # Arch 是 /usr 合并布局：/lib 必须是软链接 -> usr/lib。
          # 一旦解压后 /lib 成了真目录，chroot 里跑任何动态链接的 aarch64 程序都会报
          # "Could not open '/lib/ld-linux-aarch64.so.1'" 然后 exit 255。
          # 放在注入模块之前：模块有几百 MB，晚了就要多搬一趟。
          if [ ! -e rootfs/lib/ld-linux-aarch64.so.1 ] \
             && [ -e rootfs/usr/lib/ld-linux-aarch64.so.1 ]; then
            echo "::warning::rootfs/lib 不是软链接，修复成 usr/lib 合并布局"
            if [ -d rootfs/lib ] && [ ! -L rootfs/lib ]; then
              sudo cp -a rootfs/lib/. rootfs/usr/lib/
              sudo rm -rf rootfs/lib
            fi
            test -e rootfs/lib || sudo ln -sfn usr/lib rootfs/lib
          fi
          ls -ld rootfs/lib
          test -e rootfs/lib/ld-linux-aarch64.so.1 \
            || { echo "::error::rootfs 缺 aarch64 动态加载器 /lib/ld-linux-aarch64.so.1"; exit 1; }

      - name: 下载内核模块（本次运行）
        if: ${{ inputs.TASK != '仅内核' && !inputs.SKIP_MODULES && inputs.MODULES_RUN_ID == '' }}
        uses: actions/download-artifact@v4
        with:
          name: xaga-modules
          path: mods
          if-no-files-found: error

      # 仅RootFS 走这条：跨 run 下载必须带 github-token
      - name: 下载内核模块（指定历史 run）
        if: ${{ inputs.TASK != '仅内核' && !inputs.SKIP_MODULES && inputs.MODULES_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: xaga-modules
          path: mods
          run-id: ${{ inputs.MODULES_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          if-no-files-found: error

      - name: 注入内核模块并识别内核版本
        if: ${{ inputs.TASK != '仅内核' && !inputs.SKIP_MODULES }}
        run: |
          test -f mods/xaga-modules.tar.gz || { echo "::error::mods/xaga-modules.tar.gz 不存在"; exit 1; }
          # 从 tar 里的目录名反推内核版本：这样「仅RootFS」拉历史 artifact 也能对上，
          # 不依赖 kernel job 的 output（会被 sudo/chroot 清掉环境变量，所以落盘成文件）
          KVER=$(tar -tzf mods/xaga-modules.tar.gz \
                 | sed -n 's|^lib/modules/\([^/]*\)/.*|\1|p' \
                 | sort -u | head -n1)
          test -n "$KVER" || { echo "::error::无法从 modules tar 识别内核版本"; exit 1; }
          echo "内核模块版本：$KVER"
          echo "$KVER" | sudo tee rootfs/kver.txt > /dev/null
          sudo tar -xzf mods/xaga-modules.tar.gz -C rootfs
          ls -lh rootfs/lib/modules/

      - name: 写 rootfs 基础配置
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          printf 'xaga\n' | sudo tee rootfs/etc/hostname > /dev/null
          printf '%s\n' \
            '127.0.0.1       localhost' \
            '127.0.1.1       xaga' \
            '::1             localhost ip6-localhost ip6-loopback' \
            | sudo tee rootfs/etc/hosts > /dev/null
          # init.c 硬编码 ext4 挂载，root 必须指向物理分区
          printf '%s\n' \
            '# <device>  <mount>  <type>  <options>  <dump> <pass>' \
            '${{ inputs.ROOT_PART }}  /  ext4  defaults,noatime,errors=remount-ro  0  1' \
            | sudo tee rootfs/etc/fstab > /dev/null
          cat rootfs/etc/fstab
          printf 'root:%s\n' '${{ inputs.ROOT_PASSWORD }}' | sudo tee rootfs/rootpw.txt > /dev/null
          sudo chmod 600 rootfs/rootpw.txt

      - name: chroot 配置系统
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          # 关键改动：不再依赖 binfmt 去执行目标架构二进制。
          # Ubuntu 24.04 的 qemu-aarch64 binfmt 以 preserve-argv0(-P)/credentials 方式注册，
          # 在 chroot 下会报 "aarch64-binfmt-P: Could not open '/lib/ld-linux-aarch64.so.1'"
          # 并 exit 255。显式把 qemu-aarch64-static 作为 chroot 的第一个程序执行可以
          # 完全绕开 binfmt：qemu 本身是宿主机架构的静态二进制，由它再去翻译 /bin/bash。
          if [ "${{ inputs.RUNNER }}" = "ubuntu-24.04-arm" ]; then
            echo "ARM64 原生 runner，直接 chroot"
            CHROOT_BIN="/bin/bash"
          else
            test -x /usr/bin/qemu-aarch64-static \
              || { echo "::error::/usr/bin/qemu-aarch64-static 不存在"; exit 1; }
            file /usr/bin/qemu-aarch64-static || true
            sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
            CHROOT_BIN="/usr/bin/qemu-aarch64-static /bin/bash"
          fi
          echo "CHROOT_BIN = $CHROOT_BIN"
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo mkdir -p rootfs/proc rootfs/sys
          sudo mount -t proc  proc  rootfs/proc || true
          sudo mount -t sysfs sysfs rootfs/sys  || true

          sudo chroot rootfs ${CHROOT_BIN} -c '
          set -e
          pacman-key --init
          pacman-key --populate archlinuxarm
          # 先刷 keyring，老 tarball 直接 -Syu 会报签名失败
          pacman -Sy --noconfirm archlinuxarm-keyring || true
          pacman -Sy --noconfirm archlinux-keyring || true
          # 去掉 tarball 自带内核，用我们自己编的
          pacman -Rdd --noconfirm linux-aarch64 || true
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed ${{ inputs.EXTRA_PACKAGES }}
          pacman -S --noconfirm --needed ${{ inputs.FIRMWARE_PACKAGE }} \
            || echo "::warning::${{ inputs.FIRMWARE_PACKAGE }} 不可用，WiFi/触控可能没固件"

          sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config
          sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config
          ssh-keygen -A

          systemctl enable NetworkManager || true
          systemctl enable sshd || true
          systemctl enable systemd-resolved || true
          systemctl enable getty@tty1 || true

          chpasswd < /rootpw.txt
          rm -f /rootpw.txt
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

          if [ -f /kver.txt ]; then
            depmod -a "$(cat /kver.txt)"
            rm -f /kver.txt
          else
            echo "::warning::没有 /kver.txt，跳过 depmod（SKIP_MODULES 模式）"
          fi
          pacman -Scc --noconfirm || true
          '

      - name: 清理并校验关键项
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          sudo umount -lf rootfs/proc || true
          sudo umount -lf rootfs/sys  || true
          sudo rm -f rootfs/usr/bin/qemu-aarch64-static
          sudo rm -f rootfs/rootpw.txt rootfs/kver.txt

          # init.c 写死 execve("/sbin/init")，缺了就是开机黑屏死循环
          if [ ! -e rootfs/sbin/init ] && [ -e rootfs/usr/lib/systemd/systemd ]; then
            echo "::warning::/sbin/init 缺失，补一个到 systemd 的软链接"
            sudo mkdir -p rootfs/sbin
            sudo ln -sf /usr/lib/systemd/systemd rootfs/sbin/init
          fi
          test -e rootfs/sbin/init || { echo "::error::rootfs 里没有 /sbin/init"; exit 1; }

          # 服务没 enable 起来，第一次开机就没网没 ssh
          test -e rootfs/etc/systemd/system/multi-user.target.wants/sshd.service \
            || echo "::warning::sshd 未开机自启"
          test -e rootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service \
            || echo "::warning::NetworkManager 未开机自启"

          # 联发科固件缺了 WiFi/蓝牙/声卡/触控全废
          test -d rootfs/lib/firmware/mediatek \
            || echo "::warning::rootfs 缺 /lib/firmware/mediatek，WiFi/蓝牙/声卡/触控会废"

          ls -l rootfs/sbin/init
          ls -l rootfs/lib/modules/ || true

      - name: 打包 ext4 镜像（不使用 loop 设备）
        if: ${{ inputs.TASK != '仅内核' }}
        run: |
          truncate -s ${{ inputs.ROOTFS_SIZE }} rootfs.img
          sudo mkfs.ext4 -F -L xaga-root -d rootfs rootfs.img
          sudo e2fsck -fy rootfs.img || true
          img2simg rootfs.img rootfs-sparse.img
          ls -lh rootfs.img rootfs-sparse.img

      - name: 上传 rootfs 产物（sparse）
        if: ${{ inputs.TASK != '仅内核' }}
        uses: actions/upload-artifact@v4
        with:
          name: arch-rootfs
          path: rootfs-sparse.img
          if-no-files-found: error

      - name: 上传原始 rootfs.img
        if: ${{ inputs.TASK != '仅内核' && inputs.UPLOAD_RAW_IMG }}
        uses: actions/upload-artifact@v4
        with:
          name: arch-rootfs-raw
          path: rootfs.img
          if-no-files-found: error

  # ==========================================================
  # Job 3：构建通知
  # ==========================================================
  notify:
    name: 发送构建通知
    runs-on: ubuntu-latest
    needs: [kernel, arch-rootfs]
    if: ${{ always() && inputs.ENABLE_NOTIFY }}
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v5

      - name: 判定整体状态
        id: status
        run: |
          overall="success"
          # skipped 不算失败（TASK 模式下被跳过的 job 是正常的）
          for r in "${{ needs.kernel.result }}" "${{ needs.arch-rootfs.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              overall="failure"
            fi
          done
          echo "result=${overall}" >> $GITHUB_OUTPUT

      - name: 调用 bot.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          pip3 install --quiet requests 2>/dev/null || true
          if [ -f bot.py ]; then
            PY=bot.py
          elif [ -f .github/bot.py ]; then
            PY=.github/bot.py
          else
            echo "未找到 bot.py，跳过通知"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 "$PY" --notify \
            --status ${{ steps.status.outputs.result }} \
            --artifact-url "$RUN_URL"
